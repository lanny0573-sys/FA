<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>栽培紀錄</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F5EF;color:#1E2A24;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.6}
header{background:#1F4D3A;color:#fff;padding:28px 18px 24px}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;color:#BFD8C9;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;align-items:center}
.chip{border:1px solid #C5D2CA;background:#fff;color:#1E2A24;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:#1F4D3A;border-color:#1F4D3A;color:#fff;font-weight:700}
.chip.sort{margin-left:auto;background:#DDEBE2;border-color:#DDEBE2;color:#1F4D3A;font-weight:700}
.day h2{font-size:16px;color:#1F4D3A;margin:22px 0 8px;padding-left:10px;border-left:4px solid #C8344A}
.card{background:#fff;border:1px solid #E3E9E4;border-radius:16px;padding:14px;margin-bottom:10px}
.field{font-weight:700;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#DDEBE2;color:#1F4D3A;border-radius:14px;padding:3px 11px;font-size:14px}
.mats{margin-top:8px;font-size:14px;color:#6B7A72}
.note{margin-top:8px;font-size:15px;white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:pointer;background:#E3E9E4}
.empty{text-align:center;color:#6B7A72;padding:40px 10px}
footer{text-align:center;color:#6B7A72;font-size:12px;padding:24px 14px 40px}
#lb{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:9}
#lb img{max-width:96vw;max-height:92vh;border-radius:6px}
</style></head><body>
<header><h1 id="t">栽培紀錄</h1><p id="sub"></p></header>
<main><div class="tools" id="tools"></div><div id="app"><p class="empty">載入中…</p></div></main>
<footer>本頁由「田間管理」App 產生</footer>
<div id="lb"><img alt=""></div>
<script>
(function(){
  var app=document.getElementById('app');
  var tools=document.getElementById('tools');
  var lb=document.getElementById('lb');
  var big=lb.querySelector('img');
  var W=['日','一','二','三','四','五','六'];
  var state={field:'*',desc:true,data:null};

  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(text!==undefined)e.textContent=text;
    return e;
  }
  function dlabel(s){
    var p=s.split('-');
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    return p[0]+' 年 '+(+p[1])+' 月 '+(+p[2])+' 日 星期'+W[d.getDay()];
  }
  function chip(label,on,fn,extra){
    var b=el('button','chip'+(on?' on':'')+(extra?' '+extra:''),label);
    b.addEventListener('click',fn);
    return b;
  }

  function draw(){
    var d=state.data;
    tools.textContent='';
    app.textContent='';
    if(d.fields&&d.fields.length>1){
      tools.appendChild(chip('全部',state.field==='*',function(){state.field='*';draw();}));
      d.fields.forEach(function(f){
        tools.appendChild(chip(f,state.field===f,function(){state.field=f;draw();}));
      });
    }
    tools.appendChild(chip(state.desc?'由新到舊':'由舊到新',false,function(){state.desc=!state.desc;draw();},'sort'));

    var list=d.entries.filter(function(e){return state.field==='*'||e.field===state.field;});
    if(list.length===0){app.appendChild(el('p','empty','目前沒有紀錄。'));return;}

    var order=[];var map={};
    list.forEach(function(e){
      if(!map[e.date]){map[e.date]=[];order.push(e.date);}
      map[e.date].push(e);
    });
    order.sort();
    if(state.desc)order.reverse();

    order.forEach(function(date){
      var sec=el('section','day');
      sec.appendChild(el('h2','',dlabel(date)));
      map[date].forEach(function(e){
        var card=el('div','card');
        card.appendChild(el('div','field',e.field));
        var tags=el('div','tags');
        e.tags.forEach(function(t){tags.appendChild(el('span','tag',t));});
        if(e.time)tags.appendChild(el('span','tag',e.time));
        card.appendChild(tags);
        if(e.mats&&e.mats.length)card.appendChild(el('div','mats','使用資材:'+e.mats.join('、')));
        if(e.note)card.appendChild(el('div','note',e.note));
        if(e.photos&&e.photos.length){
          var g=el('div','photos');
          e.photos.forEach(function(p){
            var im=document.createElement('img');
            im.src=p;im.loading='lazy';im.alt='';
            im.addEventListener('click',function(){big.src=p;lb.style.display='flex';});
            g.appendChild(im);
          });
          card.appendChild(g);
        }
        sec.appendChild(card);
      });
      app.appendChild(sec);
    });
  }

  lb.addEventListener('click',function(){lb.style.display='none';big.src='';});

  fetch('data.json?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){
      state.data=d;
      document.title=d.title||'栽培紀錄';
      document.getElementById('t').textContent=d.title||'栽培紀錄';
      var sub='共 '+d.entries.length+' 筆紀錄';
      if(d.generated)sub+=' · 更新於 '+d.generated.slice(0,10);
      document.getElementById('sub').textContent=sub;
      draw();
    })
    .catch(function(){
      app.textContent='';
      app.appendChild(el('p','empty','目前沒有內容,或網頁正在更新,請過一兩分鐘再重新整理。'));
    });
})();
</script></body></html>
